; Compilar y cargar con PlatformIO:  pio run -t upload && pio device monitor
; (también se puede abrir matera_esp32/matera_esp32.ino con Arduino IDE)
[platformio]
src_dir = matera_esp32

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    adafruit/DHT sensor library@^1.4.6
    adafruit/Adafruit Unified Sensor@^1.1.14
    claws/BH1750@^1.3.0
    bblanchon/ArduinoJson@^7.2.1
